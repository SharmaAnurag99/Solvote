[toolchain]
anchor_version = "0.29.0"

[features]
seeds = false
init-if-needed = false

[[test.programTest]]
name = "rofv_contract"
program = "programs/rofv_contract"

[build]
shell = "/bin/bash"

[build.devnet]
cluster = "devnet"

[build.localnet]
cluster = "localnet"

[build.mainnet]
cluster = "mainnet"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "anchor test"
build = "anchor build"
